<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichiers Gratuits - Muzan Tech</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #00bcd4;
            color: white;
            text-align: center;
            padding: 20px 0;
        }
        .file-list {
            padding: 20px;
            text-align: center;
        }
        .file-item {
            margin: 20px 0;
        }
        .btn {
            background-color: #1abc9c;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Muzan Tech - Fichiers Gratuits</h1>
    </div>

    <div class="file-list">
        <div class="file-item">
            <h3>Bot WhatsApp - Version 1</h3>
            <button onclick="window.location.href='https://www.mediafire.com/file/example_file1.zip/file'" class="btn">Télécharger</button>
        </div>
        <div class="file-item">
            <h3>Bot WhatsApp - Version 2</h3>
